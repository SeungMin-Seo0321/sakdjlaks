<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma</title>
    <style>
        :root {
            --bg-color: #fcfcf9;
            --chat-bg: #ffffff;
            --primary-color: #26c6da;
            --accent-color: #f4d03f;
            --text-color: #444;
            --user-bubble: #e0f7fa;
            --ai-bubble: #f1f8e9;
            --border-radius: 12px;
        }
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        #chat-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }
        #url-area {
            padding: 12px 15px;
            display: flex;
            gap: 8px;
            background-color: #fff8e1;
            border-bottom: 1px solid #ffe082;
        }
        #url-input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid #ffe082;
            border-radius: var(--border-radius);
            font-size: 13px;
            outline: none;
        }
        #url-input:focus { border-color: var(--accent-color); }
        #url-btn {
            padding: 0 15px;
            background: var(--accent-color);
            color: #333;
            border: none;
            border-radius: var(--border-radius);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        #input-area {
            border-bottom: 1px solid #eee;
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: #fafafa;
        }
        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            background-color: white;
        }
        textarea:focus { border-color: var(--primary-color); }
        button {
            padding: 0 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #00acc1 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        #status {
            font-size: 12px;
            text-align: center;
            color: #ff5722;
            padding: 5px;
            background-color: #fafafa;
            border-bottom: 1px solid #eee;
            font-weight: bold;
        }
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }
        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            border-bottom-left-radius: 4px;
        }
    </style>
</head>
<body>
<div id="chat-container">
    <header>
        <h1>Luma</h1>
        <p>따뜻하고 친절하며, 무엇보다 정확한 답변을 드릴게요!</p>
    </header>
    <div id="url-area">
        <input id="url-input" type="text" placeholder="캐글에서 나온 URL 붙여넣기 (예: https://xxx.loca.lt/chat)" />
        <button id="url-btn">연결</button>
    </div>
    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="위에서 URL을 먼저 연결하세요." disabled></textarea>
        <button id="send-btn" disabled>전송</button>
    </div>
    <div id="status">URL을 입력하고 연결 버튼을 눌러주세요.</div>
    <div id="chat-window">
        <div class="message ai">안녕하세요! 저는 Luma입니다. 캐글에서 나온 URL을 위에 입력해주세요!</div>
    </div>
</div>

<script>
    let kaggleApiUrl = '';
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');
    const urlInput = document.getElementById('url-input');
    const urlBtn = document.getElementById('url-btn');
    let chatHistory = [];

    urlBtn.addEventListener('click', async () => {
        const url = urlInput.value.trim();
        if (!url) return;

        kaggleApiUrl = url.endsWith('/chat') ? url : url + '/chat';
        statusDiv.innerText = "연결 테스트 중...";
        statusDiv.style.color = "#f57c00";

        try {
            const res = await fetch(kaggleApiUrl + "?bypass=true", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'bypass-tunnel-reminder': 'true'
                },
                body: JSON.stringify({ message: "ping", history: [] })
            });
            if (!res.ok) throw new Error();
            statusDiv.innerText = "✅ Luma 서버 연결 완료!";
            statusDiv.style.color = "#2e7d32";
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = "Luma에게 질문하세요... (Enter로 전송)";
            userInput.focus();
        } catch (e) {
            statusDiv.innerText = "❌ 연결 실패. URL을 확인하거나 캐글 노트북이 실행 중인지 확인하세요.";
            statusDiv.style.color = "#d32f2f";
        }
    });

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message || !kaggleApiUrl) return;

        appendMessage('user', message);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;

        try {
            const response = await fetch(kaggleApiUrl + "?bypass=true", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'bypass-tunnel-reminder': 'true'
                },
                body: JSON.stringify({ message: message, history: chatHistory })
            });
            if (!response.ok) throw new Error();
            const data = await response.json();
            appendMessage('ai', data.response);
            chatHistory.push([message, data.response]);
        } catch (error) {
            appendMessage('ai', '서버 통신 실패. 캐글 창이 꺼졌거나 잠들었는지 확인해 주세요.');
        } finally {
            sendBtn.disabled = false;
            userInput.focus();
        }
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        this.style.overflowY = this.scrollHeight > 150 ? "scroll" : "hidden";
    });
    sendBtn.addEventListener('click', sendMessage);
</script>
</body>
</html>
