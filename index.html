<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma: 따뜻하고 정확한 AI 친구</title>
    <style>
        :root {
            --bg-color: #fcfcf9;
            --chat-bg: #ffffff;
            --primary-color: #26c6da;
            --accent-color: #f4d03f;
            --text-color: #444;
            --user-bubble: #e0f7fa;
            --ai-bubble: #f1f8e9;
            --border-radius: 12px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative;
        }

        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        #input-area {
            border-bottom: 1px solid #eee;
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: #fafafa;
            z-index: 10;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            background-color: white;
        }

        textarea:focus { border-color: var(--primary-color); }

        button {
            padding: 0 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #00acc1 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        #status { font-size: 12px; text-align: center; color: #ff5722; padding: 5px; background-color: #fafafa; border-bottom: 1px solid #eee; font-weight: bold;}

        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            border-bottom-left-radius: 4px;
        }
    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <h1>Luma</h1>
        <p>따뜻하고 친절하며, 무엇보다 정확한 답변을 드릴게요!</p>
    </header>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="서버 주소를 안전하게 동기화하는 중..." disabled></textarea>
        <button id="send-btn" disabled>전송</button>
    </div>
    
    <div id="status">캐글 서버 상태 점검 중...</div>
    
    <div id="chat-window">
        <div class="message ai">안녕하세요! 저는 Luma입니다. 주소 동기화가 안전하게 완료되면 대화를 시작합니다.</div>
    </div>
</div>

<script>
    // 파이썬 코드와 동일한 우체통 이름
    const BUCKET_NAME = "luma-chat-shared-bucket-2026";
    
    let kaggleApiUrl = '';
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusDiv = document.getElementById('status');
    
    let chatHistory = [];

    // [보안 우회 패치 적용] 브라우저의 직접적인 CORS 제한을 우회하여 주소를 안전하게 긁어옵니다.
    async function fetchLatestServerUrl() {
        try {
            const targetUrl = `https://kvdb.io/${BUCKET_NAME}/api_url?t=${new Date().getTime()}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
            
            const response = await fetch(proxyUrl);
            if(!response.ok) throw new Error();
            
            const data = await response.json();
            kaggleApiUrl = data.contents.trim();
            
            if (!kaggleApiUrl.startsWith('http')) {
                throw new Error("올바르지 않은 주소 형식");
            }
            
            // 연결 성공 및 입력창 활성화
            statusDiv.innerText = "Luma 서버 연결 완료 (정확성 최우선 상태)";
            statusDiv.style.color = "#2e7d32";
            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.placeholder = "Luma에게 질문하세요... (Enter로 전송)";
        } catch (error) {
            statusDiv.innerText = "동기화 실패. 캐글 노트북이 현재 실행 중인지 다시 확인해 주세요.";
            statusDiv.style.color = "#d32f2f";
        }
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message || !kaggleApiUrl) return;

        appendMessage('user', message);
        userInput.value = '';
        userInput.style.height = 'auto'; 
        sendBtn.disabled = true; 

        try {
            const response = await fetch(kaggleApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    history: chatHistory
                })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();
            const lumaResponse = data.response;

            appendMessage('ai', lumaResponse);
            chatHistory.push([message, lumaResponse]); 

        } catch (error) {
            appendMessage('ai', '서버와 신호를 주고받지 못했습니다. 캐글 브라우저 탭이 백그라운드에서 절전 상태가 되었는지 확인해 주세요.');
        } finally {
            sendBtn.disabled = false; 
            userInput.focus(); 
        }
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        this.style.overflowY = this.scrollHeight > 150 ? "scroll" : "hidden";
    });

    sendBtn.addEventListener('click', sendMessage);

    // 구동 즉시 우회 동기화 로직 가동
    window.addEventListener('DOMContentLoaded', fetchLatestServerUrl);
</script>

</body>
</html>
