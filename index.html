<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luma: 따뜻하고 정확한 AI 친구</title>
    <style>
        /* [밝고 친절한 테마 설정] 전체적인 색감을 파스텔 톤으로 구성 */
        :root {
            --bg-color: #fcfcf9;
            --chat-bg: #ffffff;
            --primary-color: #26c6da; /* 따뜻한 민트 */
            --accent-color: #f4d03f; /* 밝은 노란색 */
            --text-color: #444;
            --user-bubble: #e0f7fa;
            --ai-bubble: #f1f8e9;
            --border-radius: 12px;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        #chat-container {
            width: 100%;
            max-width: 600px;
            background-color: var(--chat-bg);
            display: flex;
            flex-direction: column;
            border-left: 1px solid #eee;
            border-right: 1px solid #eee;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            position: relative;
        }

        /* 헤더: 밝은 분위기와 정확성을 강조 */
        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        header p { margin: 5px 0 0; font-size: 14px; opacity: 0.9; }

        /* [수정] 입력 및 전송 영역을 상단에 고정 */
        #input-area {
            border-bottom: 1px solid #eee;
            padding: 15px;
            display: flex;
            gap: 10px;
            background-color: #fafafa;
            z-index: 10;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: var(--border-radius);
            font-size: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
            background-color: white;
        }

        textarea:focus { border-color: var(--primary-color); }

        button {
            padding: 0 25px;
            background: linear-gradient(135deg, var(--primary-color) 0%, #00acc1 100%);
            color: white;
            border: none;
            border-radius: var(--border-radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }

        /* 정확성 우선 상태 표시 */
        #status { font-size: 12px; text-align: center; color: #888; padding: 5px; background-color: #fafafa; border-bottom: 1px solid #eee; }

        /* 채팅 메시지 영역 (역순 정렬로 스크롤 관리 원활하게 설정) */
        #chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: var(--border-radius);
            font-size: 15px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: var(--ai-bubble);
            border-bottom-left-radius: 4px;
        }

    </style>
</head>
<body>

<div id="chat-container">
    <header>
        <h1>Luma</h1>
        <p>따뜻하고 친절하며, 무엇보다 정확한 답변을 드릴게요!</p>
    </header>

    <div id="input-area">
        <textarea id="user-input" rows="1" placeholder="Luma에게 질문하세요... (Enter로 전송)"></textarea>
        <button id="send-btn">전송</button>
    </div>
    
    <div id="status">정확성을 최우선으로 생각합니다.</div>
    
    <div id="chat-window">
        <div class="message ai">안녕하세요! 저는 Luma입니다. 무엇을 도와드릴까요? 논리적이거나 수학적인 문제도 조건에 맞춰 차근차근 해결해 드립니다.</div>
    </div>
</div>

<script>
    // [설정] 캐글 실행 창에 뜬 실제 Localtunnel 주소를 여기에 입력하세요.
    const kaggleApiUrl = 'https://my-luma-chat-service.loca.lt/chat'; 

    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    
    let chatHistory = [];

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.innerText = text;
        chatWindow.appendChild(msgDiv);
        
        // 새 메시지가 추가되면 대화창 맨 아래로 스크롤 이동
        chatWindow.scrollTop = chatWindow.scrollHeight;
    }

    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage('user', message);
        userInput.value = '';
        userInput.style.height = 'auto'; 
        sendBtn.disabled = true; 

        try {
            const response = await fetch(kaggleApiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: message,
                    history: chatHistory
                })
            });

            if (!response.ok) throw new Error('서버와 연결할 수 없습니다.');

            const data = await response.json();
            const lumaResponse = data.response;

            appendMessage('ai', lumaResponse);
            chatHistory.push([message, lumaResponse]); 

        } catch (error) {
            console.error('에러:', error);
            appendMessage('ai', '죄송합니다, 잠시 서버와 연결이 불안정합니다. 캐글 노트북이 실행 중인지 확인해 주세요.');
        } finally {
            sendBtn.disabled = false; 
            userInput.focus(); 
        }
    }

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    userInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
        if (this.scrollHeight > 150) {
            this.style.overflowY = "scroll";
        } else {
            this.style.overflowY = "hidden";
        }
    });

    sendBtn.addEventListener('click', sendMessage);
</script>

</body>
</html>
